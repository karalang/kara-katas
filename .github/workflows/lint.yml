name: lint

# Runs on every push to main (the cloud kata-authoring sessions push here
# directly) and on PRs, so a bench.sh committed without its executable bit is
# caught in CI rather than at the next person's first bench run (exit 126).
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-katas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: kata structural lints (bench.sh exec bit)
        run: ./scripts/lint-katas.sh

      # A par lane that measures the seq binary is worse than a wrong number,
      # because it is intermittent: the generated build helper rebuilds only
      # when the source is newer than the output, so whether a bench measures
      # what it claims can come down to file mtimes. Caught kata 286 on its
      # first run; see the script's header for the measurement.
      - name: par lane builds with auto-par ON
        run: python3 scripts/lint-par-lane.py

      # Pure-python, no build. The bench cell join matches on
      # (kata, lang, approach, lane, mode, metric) and nothing else, so without
      # a workload/sink guard it divides a 500,000-iteration run by a
      # 50,000-iteration one and calls the quotient a regression — which is
      # exactly how three katas produced the top three entries of a corpus
      # median that was read as a compiler regression for two months
      # (kara B-2026-08-05-34). The guard is cheap; a guard nobody tests is how
      # the next one rots.
      - name: bench-compare workload/sink guard self-test
        run: python3 scripts/test-bench-compare.py
