# Settings for the orders service.
[DEFAULT]
home = /srv/orders
log_dir = %(home)s/logs
debug = no

[server]
host = 0.0.0.0
port = 8080
workers: 4
Debug = Yes
url = http://%(host)s:%(port)s/
pid_file = %(home)s/run/orders.pid

[database]
; the replica is read-only
url = postgresql://orders@db.internal:5432/orders
pool size = 10
timeout = 30s
log_file = %(log_dir)s/db.log

[paths]
static = %(home)s/static
media = %(static)s/../media
progress = 100%%
broken = %(nowhere)s/x
loop = %(loop)s
bad = 50% done
