[PHP]
engine = On
short_open_tag = Off ; deprecated
precision = 14
memory_limit = 128M ;per script
error_reporting = E_ALL & ~E_DEPRECATED
display_errors = Off
date.timezone = "UTC"
include_path = ".:/usr/share/php"

[Session]
session.save_path = "/var/lib/php/sessions"
session.name = PHPSESSID;not a comment here
