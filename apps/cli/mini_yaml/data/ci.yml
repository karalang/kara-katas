name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
        python: ["3.11", "3.12", 3.10]
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python -m pip install -U pip
          pip install -e ".[test]"
      - name: Test
        run: pytest -q --maxfail=1
        env:
          CI: true
          PYTHONHASHSEED: 0
      - name: Summary
        if: ${{ always() }}
        run: >-
          echo "tests finished for
          ${{ matrix.os }}" >> $GITHUB_STEP_SUMMARY
