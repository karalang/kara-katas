# scalars the way YAML 1.1 (and PyYAML) read them
country: NO
answer: yes
switch: off
nothing: ~
empty:
octal: 0755
hex: 0x1F
binary: 0b1010
million: 1_000_000
sexagesimal: 190:20:30
negative: -42
float: 3.0
half: .5
exponent: 6.02e+23
not_a_float: 1e3
infinity: -.inf
version: 1.10
date: 2026-10-14
stamp: 2026-10-14T09:12:01Z
local: 2026-10-14 09:12:01.5
quoted: "tab\there, \u00e9, \"quotes\", \\"
single: 'it''s ''quoted'''
unicode: café
