<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{% block title %}{{ site.name }}{% endblock %}</title>
</head>
<body>
  <nav>
  {% for item in site.nav %}
    <a href="{{ item.href }}"{% if loop.first %} class="first"{% endif %}>{{ item.title }}</a>{% if not loop.last %} |{% endif %}

  {% endfor %}
  </nav>
  <p class="tagline">{{ site.tagline }}</p>
  <main>
{% block content %}
    <p>Nothing here yet.</p>
{% endblock %}
  </main>
{% include "footer.html" %}
</body>
</html>
