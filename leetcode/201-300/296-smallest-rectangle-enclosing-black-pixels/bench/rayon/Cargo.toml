# Rayon-parallel Rust mirror for the LeetCode #296 bench (par lane).
#
# Kāra's auto-par fans out the FOUR INDEPENDENT EDGE SEARCHES inside min_area
# (confirmed by `karac query concurrency`: parallel_groups [0,1,2,3], "no data
# or effect dependencies"). This mirror does the same thing by hand with two
# nested `rayon::join`s. See ../blackpixels.rs for the single-threaded seq-lane
# baseline.
[package]
name = "blackpixels_rayon"
version = "0.1.0"
edition = "2021"
[dependencies]
rayon = "1.10"
[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"
